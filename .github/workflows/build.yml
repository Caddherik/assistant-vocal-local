name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: .ipa non signé
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Versions de l'outillage
        run: |
          sw_vers
          xcodebuild -version
          echo "SDK iOS : $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Générer le projet (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: Compiler pour l'iPhone, sans signature
        run: |
          set -o pipefail
          xcodebuild \
            -project AssistantVocal.xcodeproj \
            -scheme AssistantVocal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Emballer le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AssistantVocal.app Payload/
          zip -qry AssistantVocal.ipa Payload
          ls -lh AssistantVocal.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: AssistantVocal-${{ github.run_number }}
          path: AssistantVocal.ipa
          retention-days: 14
          if-no-files-found: error
